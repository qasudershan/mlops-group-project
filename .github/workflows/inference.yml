name: Inference

on:
  workflow_dispatch:
    inputs:
      input_text:
        description: 'Text to classify (e.g. This movie was great!)'
        required: true
        default: 'This movie was absolutely fantastic!'

jobs:
  infer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run inference
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_MODEL_NAME: qasudershan/mlops-imdb-sentiment
          INPUT_TEXT: ${{ github.event.inputs.input_text }}
        run: python src/inference.py